<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candeia — exemplo</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 16px; }
  label { display: block; margin-top: .75rem; font-weight: 600; }
  input { width: 100%; padding: .4rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: .5rem 1rem; }
  pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; }
</style>
</head>
<body>
<h1>Candeia</h1>
<p>Sirva a raiz do repositório (por exemplo <code>npx http-server .</code>) e abra <code>/exemplo/</code>.
A URL do índice precisa permitir CORS para esta origem.</p>
<form id="f">
  <label>URL do índice <input name="base" required placeholder="https://dados.exemplo.dev/cnefe2022/"></label>
  <label>Município (código IBGE) <input name="municipio" required value="5208707"></label>
  <label>Endereço <input name="endereco" required value="Rua 8, Qd 21 Lt 4"></label>
  <label>Bairro <input name="bairro"></label>
  <label>CEP <input name="cep"></label>
  <button>Geocodificar</button>
</form>
<pre id="saida"></pre>
<script type="module">
  import { criarGeocodificador } from "../src/index.js";
  let geo = null, baseAtual = null;
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(ev.target));
    if (d.base !== baseAtual) { geo = criarGeocodificador({ base: d.base }); baseAtual = d.base; }
    const saida = document.getElementById("saida");
    saida.textContent = "…";
    const t0 = performance.now();
    try {
      const r = await geo.geocodificar(d.endereco, { municipio: d.municipio, bairro: d.bairro, cep: d.cep });
      const { status, metodo, coord, raio, confianca, viaKey, motivo } = r;
      saida.textContent = JSON.stringify({ status, metodo, coord, raio, confianca, viaKey, motivo,
        ms: Math.round(performance.now() - t0) }, null, 2);
    } catch (e) {
      saida.textContent = String(e);
    }
  });
</script>
</body>
</html>
